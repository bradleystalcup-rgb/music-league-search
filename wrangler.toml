name = "music-league-search"
main = "src/worker.js"
compatibility_date = "2024-09-23"
workers_dev = false

# Static files in public/ are served automatically ahead of the Worker for
# any request that matches a file (styles.css, vendor/*, favicon, etc.);
# everything else falls through to the Hono app in src/worker.js.
[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "musicleague-db"
database_id = "a93a87f3-a4f9-4037-a60c-86418c390a46"
